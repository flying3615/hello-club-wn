<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hello Club — 预约监控</title>
  <style>
    :root {
      --paper: #f5f4ef;
      --ink: #18231f;
      --muted: #627069;
      --line: #ccd4cd;
      --card: #fffefa;
      --green: #286b4e;
      --green-soft: #e0eee4;
      --amber: #9a6515;
      --amber-soft: #f8ebcf;
      --red: #aa3e35;
      --red-soft: #f7ded9;
      --slate: #42524b;
      --shadow: 0 1px 1px rgba(24,35,31,.05), 0 8px 24px rgba(24,35,31,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper:#121815; --ink:#e4e9e3; --muted:#a7b4ac; --line:#33443b; --card:#1a241f; --green:#82c59d; --green-soft:#1c3929; --amber:#e9b967; --amber-soft:#3c2d17; --red:#ef958b; --red-soft:#462321; --slate:#bdcbc3; --shadow:none; }
    }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family: ui-rounded, "Avenir Next", Avenir, "Segoe UI", sans-serif; }
    .wrap { width:min(1120px, calc(100% - 32px)); margin:0 auto; padding:24px 0 40px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding:0 0 18px; border-bottom:1px solid var(--line); }
    .eyebrow { font-size:12px; font-weight:700; color:var(--green); letter-spacing:.11em; text-transform:uppercase; margin-bottom:7px; }
    h1 { margin:0; font-size:clamp(26px, 3.2vw, 34px); letter-spacing:-.035em; line-height:1.05; font-weight:760; }
    .sub { color:var(--muted); font-size:14px; margin:9px 0 0; max-width:640px; line-height:1.5; }
    .refresh { text-align:right; color:var(--muted); font-size:12px; line-height:1.5; min-width:180px; }
    .refresh strong { display:block; color:var(--ink); font-variant-numeric:tabular-nums; font-size:13px; }
    .grid { display:grid; grid-template-columns:1fr; gap:14px; margin-top:16px; }
    .full { grid-column:1 / -1; }
    section { background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; }
    .heading { padding:15px 18px 13px; display:flex; align-items:baseline; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); }
    h2 { font-size:15px; letter-spacing:-.01em; margin:0; }
    .note { font-size:12px; color:var(--muted); }
    .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:var(--slate); }
    .dot.good { background:var(--green); box-shadow:0 0 0 4px var(--green-soft); }
    .dot.warn { background:var(--amber); box-shadow:0 0 0 4px var(--amber-soft); }
    .dot.bad { background:var(--red); box-shadow:0 0 0 4px var(--red-soft); }
    .detail { color:var(--muted); font-size:13px; line-height:1.5; }
    .empty { padding:22px 18px; color:var(--muted); font-size:14px; line-height:1.55; }
    .job-summary { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding:20px 18px 0; }
    .job-date { color:var(--muted); font-size:13px; font-weight:650; }
    .job-time { margin-top:2px; font-size:clamp(24px, 3vw, 32px); font-weight:780; letter-spacing:-.04em; line-height:1.05; }
    .job-time time { font:inherit; font-variant-numeric:tabular-nums; }
    .job-status { padding-top:2px; }
    .job-meta { display:flex; flex-wrap:wrap; gap:6px 18px; padding:12px 18px 18px; color:var(--muted); font-size:12px; }
    .job-meta b { color:var(--ink); font-weight:650; }
    .recurring-last { padding:0 18px 18px; color:var(--muted); font-size:12px; line-height:1.6; }
    .recurring-last b { color:var(--ink); }
    .pill { display:inline-flex; align-items:center; min-height:22px; padding:2px 9px; border-radius:99px; background:var(--green-soft); color:var(--green); font-size:11px; font-weight:700; letter-spacing:.02em; white-space:nowrap; }
    .pill.warn { background:var(--amber-soft); color:var(--amber); }.pill.bad { background:var(--red-soft); color:var(--red); }.pill.slate { background:color-mix(in srgb, var(--line) 55%, transparent); color:var(--slate); }
    dl { display:grid; grid-template-columns:1fr; gap:13px; margin:0; }
    dt { font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--muted); }
    dd { margin:4px 0 0; font-size:14px; line-height:1.35; font-weight:570; }
    .safety { padding:10px 18px; border-top:1px solid var(--line); background:color-mix(in srgb, var(--green-soft) 45%, transparent); color:var(--slate); font-size:12px; line-height:1.45; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
    th { text-align:left; padding:10px 16px; color:var(--muted); font-size:11px; letter-spacing:.04em; border-bottom:1px solid var(--line); font-weight:750; white-space:nowrap; }
    td { padding:12px 16px; border-bottom:1px solid color-mix(in srgb, var(--line) 75%, transparent); vertical-align:top; line-height:1.45; }
    tbody tr:last-child td { border-bottom:0; }
    .mono, time { font-family:"SFMono-Regular", Menlo, Consolas, monospace; font-size:12px; font-variant-numeric:tabular-nums; }
    .muted { color:var(--muted); }.tight { white-space:nowrap; }
    .message { padding:11px 14px; margin:18px 0 0; border:1px solid var(--amber); color:var(--amber); background:var(--amber-soft); border-radius:8px; font-size:13px; display:none; }
    .message.show { display:block; }
    .statusbar { display:flex; align-items:center; gap:0; margin-top:12px; border:1px solid var(--line); border-radius:9px; background:var(--card); overflow:auto; box-shadow:var(--shadow); }
    .status-item { display:flex; align-items:center; gap:7px; padding:9px 13px; border-right:1px solid var(--line); font-size:12px; color:var(--muted); white-space:nowrap; }
    .status-item:last-child { border-right:0; }.status-item strong { color:var(--ink); font-size:12px; }
    .failure-banner { display:flex; gap:12px; align-items:flex-start; margin:14px 0 0; padding:14px 16px; border:1px solid color-mix(in srgb, var(--red) 45%, var(--line)); border-left:5px solid var(--red); border-radius:9px; background:var(--red-soft); }
    .failure-banner[hidden] { display:none; }
    .failure-symbol { width:28px; height:28px; flex:0 0 auto; display:grid; place-items:center; border-radius:50%; background:var(--red); color:var(--card); font-weight:800; font-size:16px; }
    .failure-body { min-width:0; }
    .failure-title { font-size:15px; font-weight:800; letter-spacing:-.01em; color:var(--ink); }
    .failure-reason { margin-top:4px; font-size:14px; font-weight:650; line-height:1.4; color:var(--ink); }
    .failure-detail { margin-top:4px; font-size:13px; line-height:1.5; color:var(--slate); }
    .failure-action { margin-top:8px; font-size:13px; font-weight:750; color:var(--red); }
    .failure-adjacent { margin-top:8px; font-size:13px; line-height:1.5; color:var(--ink); }
    .failure-adjacent b { color:var(--red); }
    .failure-meta { display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:9px; color:var(--muted); font-size:11px; overflow-wrap:anywhere; }
    .failure-meta .mono { font-size:11px; }
    .success-banner { display:flex; gap:12px; align-items:flex-start; margin:14px 0 0; padding:14px 16px; border:1px solid color-mix(in srgb, var(--green) 45%, var(--line)); border-left:5px solid var(--green); border-radius:9px; background:var(--green-soft); }
    .success-banner[hidden] { display:none; }
    .success-symbol { width:28px; height:28px; flex:0 0 auto; display:grid; place-items:center; border-radius:50%; background:var(--green); color:var(--card); font-weight:800; font-size:15px; }
    .success-title { font-size:15px; font-weight:800; letter-spacing:-.01em; color:var(--ink); }
    .success-reason { margin-top:4px; font-size:14px; font-weight:650; line-height:1.4; color:var(--ink); }
    .success-meta { display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:6px; color:var(--muted); font-size:11px; }
    details.secondary { grid-column:1 / -1; border:1px solid var(--line); border-radius:10px; background:var(--card); overflow:hidden; box-shadow:var(--shadow); }
    details.secondary summary { cursor:pointer; padding:14px 18px; font-size:14px; font-weight:700; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    details.secondary summary::-webkit-details-marker { display:none; }
    details.secondary summary::after { content:'+'; color:var(--muted); font-size:18px; font-weight:400; } details.secondary[open] summary::after { content:'−'; }
    details.secondary .secondary-body { border-top:1px solid var(--line); }
    @media (max-width:880px) { .grid { grid-template-columns:1fr; }.full{grid-column:auto}.focus-grid{grid-template-columns:1fr}.processes{grid-template-columns:1fr}.process{border-right:0;border-bottom:1px solid var(--line)}.process:last-child{border-bottom:0} details.secondary{grid-column:auto} }
    @media (max-width:620px) { .wrap{width:min(100% - 24px, 1440px); padding-top:20px} header{align-items:flex-start; flex-direction:column}.refresh{text-align:left} dl{grid-template-columns:1fr}.heading{padding:15px 16px}.job{padding:16px}.status-item{padding:8px 10px} }
    @media (prefers-reduced-motion:no-preference) { .dot.good { animation:pulse 2s ease-in-out infinite; } @keyframes pulse { 50%{ box-shadow:0 0 0 7px transparent;} } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <div class="eyebrow">Wellington North Badminton Stadium</div>
        <h1>预约监控</h1>
        <p class="sub">只读 · 定时调度与已核验预约</p>
      </div>
      <div class="refresh"><strong id="updated">正在加载状态…</strong><span>每小时自动刷新</span></div>
    </header>
    <div id="error" class="message"></div>
    <div id="system-status" class="statusbar" aria-label="System status"></div>
    <div id="success" class="success-banner" role="status" aria-live="polite" hidden></div>
    <div id="failure" class="failure-banner" role="status" aria-live="polite" hidden></div>

    <div class="grid">
      <section>
        <div class="heading"><h2>当前任务</h2><span class="note">日期 · 时间 · 开抢</span></div>
        <div id="active-job"></div>
        <div class="safety" id="safety"></div>
      </section>

      <section>
        <div class="heading"><h2>周期任务</h2><span class="note">每周重复</span></div>
        <div id="recurring"></div>
      </section>

      <section>
        <div class="heading"><h2>即将到来的预约</h2><span class="note" id="upcoming-count"></span></div>
        <div id="upcoming-bookings"></div>
      </section>

      <details class="secondary">
        <summary>历史预约 <span class="note" id="past-count"></span></summary>
        <div class="secondary-body" id="past-bookings"></div>
      </details>

      <details class="secondary">
        <summary>调度活动 <span class="note">最近事件</span></summary>
        <div class="secondary-body" id="activity"></div>
      </details>
    </div>
  </main>
  <script>
    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const nzDateParts = (value) => value ? Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone:'Pacific/Auckland', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).formatToParts(new Date(value)).filter(p => p.type !== 'literal').map(p => [p.type, p.value])) : null;
    const dateTime = (value) => { const p = nzDateParts(value); return p ? `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}` : '—'; };
    const dateOnly = (value) => value ? String(value) : '—';
    const weekdayLabel = (value) => {
      if (!value) return '';
      try { return new Intl.DateTimeFormat('zh-CN', { timeZone:'UTC', weekday:'short' }).format(new Date(`${value}T12:00:00Z`)); } catch { return ''; }
    };
    const jobDateLabel = (value) => value ? `${value} ${weekdayLabel(value)}` : '—';
    const STATUS_LABELS = {
      completed: '已完成', failed: '失败', running: '运行中', missed: '已错过',
      not_due: '未到时间', waiting: '等待中', idle: '空闲', scheduled: '已排期',
      candidate: '候选', no_complete_interval: '无完整时段', watch_complete: '观察完成',
      watch_timeout: '观察超时', inspect_complete: '检查完成', booking_verified: '预约成功',
      reconciled_verified: '已核验', late_start: '启动过晚',
      already_terminal_or_running: '已结束或运行中', payment_required: '需要支付',
      free: '免费', unpaid_hold: '待支付', paid: '已支付', unknown: '未知',
    };
    const statusLabel = (status) => STATUS_LABELS[status] || String(status || '未知').replaceAll('_', ' ');
    const badge = (status) => {
      const s = String(status || 'unknown');
      const cls = /complete|verified|reconciled|free|paid|running/.test(s) ? '' : /fail|miss|timeout|unavailable|late|error/.test(s) ? 'bad' : 'warn';
      return `<span class="pill ${cls}">${esc(statusLabel(s))}</span>`;
    };
    const statusItem = (label, state, kind) => `<span class="status-item"><span class="dot ${kind}"></span><strong>${esc(label)}</strong> ${esc(state)}</span>`;
    function renderProcesses(processes) {
      const dispatcher = processes.dispatcher;
      const dispatcherHealthy = dispatcher.configured && ['running','not running'].includes(dispatcher.state);
      const lastRunFailed = dispatcherHealthy && Number.isFinite(dispatcher.lastExitCode) && dispatcher.lastExitCode !== 0;
      const dispatcherLabel = !dispatcherHealthy ? '需要检查' : lastRunFailed ? '上次运行失败' : (dispatcher.state === 'running' ? '检查中' : '空闲');
      const dispatcherKind = !dispatcherHealthy ? 'bad' : lastRunFailed ? 'warn' : 'good';
      const chromeGood = processes.chrome.processDetected && processes.chrome.cdpReachable;
      const runner = processes.runner;
      document.querySelector('#system-status').innerHTML = [
        statusItem('调度器', dispatcherLabel, dispatcherKind),
        statusItem('Chrome', chromeGood ? '已连接' : '未连接', chromeGood ? 'good' : 'bad'),
        statusItem('运行器', runner.state === 'running' ? '运行中' : '空闲', runner.state === 'running' ? 'good' : 'warn'),
      ].join('');
    }
    function renderSuccess(success) {
      const el = document.querySelector('#success');
      if (!success) { el.hidden = true; el.innerHTML = ''; return; }
      const job = success.job || {};
      const windowText = job.date ? `${jobDateLabel(job.date)} ${job.start || ''}–${job.end || ''}` : '预约';
      const meta = [
        '已从 Hello Club 远端核验',
        success.court ? `场地 ${success.court}` : '',
        success.paymentStatus ? `支付 ${statusLabel(success.paymentStatus)}` : '',
        success.verifiedAt ? `核验于 ${dateTime(success.verifiedAt)}` : '',
      ].filter(Boolean).map((item) => `<span>${esc(item)}</span>`).join('');
      el.hidden = false;
      el.innerHTML = `<div class="success-symbol" aria-hidden="true">✓</div><div class="failure-body"><div class="success-title">上次预约成功</div><div class="success-reason">${esc(windowText)}</div><div class="success-meta">${meta}</div></div>`;
    }
    function renderFailure(failure) {
      const el = document.querySelector('#failure');
      if (!failure) { el.hidden = true; el.innerHTML = ''; return; }
      const job = failure.job || {};
      const windowText = job.date ? `${job.date}${job.start && job.end ? ` ${job.start}–${job.end}` : ''}` : '';
      const meta = [
        windowText ? `<span>时段 ${esc(windowText)}</span>` : '',
        job.id ? `<span>任务 <span class="mono">${esc(job.id)}</span></span>` : '',
        failure.attemptedAt ? `<span>尝试于 ${dateTime(failure.attemptedAt)}</span>` : '',
        failure.code ? `<span class="mono">错误码 ${esc(failure.code)}</span>` : '',
      ].filter(Boolean).join('');
      const adjacent = Array.isArray(failure.adjacent) ? failure.adjacent : [];
      const adjacentHtml = adjacent.length
        ? `<div class="failure-adjacent"><b>当天相邻可订：</b>${adjacent.map((item) => `${esc(item.court)} ${esc(item.start)}–${esc(item.end)}`).join('；')}</div>`
        : failure.adjacentWindow ? '<div class="failure-adjacent">当天相邻时段暂无可订场次。</div>' : '';
      el.hidden = false;
      el.innerHTML = `<div class="failure-symbol" aria-hidden="true">!</div><div class="failure-body"><div class="failure-title">${esc(failure.title)}</div><div class="failure-reason">${esc(failure.reason)}</div><div class="failure-detail">${esc(failure.detail)}</div><div class="failure-action">${esc(failure.action)}</div>${adjacentHtml}<div class="failure-meta">${meta}</div></div>`;
    }
    function renderRecurring(recurring) {
      const el = document.querySelector('#recurring');
      const weekend = recurring?.weekend;
      if (!weekend) { el.innerHTML = '<div class="empty">未配置周期任务。</div>'; return; }
      const lastFailed = Number.isFinite(weekend.lastExitCode) && weekend.lastExitCode !== 0;
      const status = !weekend.configured ? '未安装' : lastFailed ? '上次执行失败' : '已启用';
      const statusKind = !weekend.configured ? 'bad' : lastFailed ? 'warn' : '';
      const next = weekend.next;
      const nextText = next ? `${next.local} · 目标 ${next.targetDate}` : '无法计算下一次执行';
      const last = weekend.lastReport;
      let lastHtml = '<div class="recurring-last">尚未执行过；首次运行会为下周同一天下单。</div>';
      if (last && last.status === 'success') {
        lastHtml = `<div class="recurring-last">上次成功：${esc(last.targetDate)} · ${esc(last.court || '—')} · 订单号 <span class="mono">${esc(last.remoteBookingId || '—')}</span></div>`;
      } else if (last && last.status === 'failed') {
        const adjacent = last.adjacent?.runs || [];
        lastHtml = `<div class="recurring-last"><b>上次失败：</b>${esc(last.error || '未知错误')}${adjacent.length ? `<br><b>当天相邻可订：</b>${adjacent.map((run) => `${esc(run.court)} ${esc(run.start)}–${esc(run.end)}`).join('；')}` : '<br>当天相邻时段暂无可订场次。'}</div>`;
      }
      el.innerHTML = `<div class="job-summary"><div><div class="job-date">每周六、周日</div><div class="job-time">08:00–09:30</div></div><div class="job-status"><span class="pill ${statusKind}">${esc(status)}</span></div></div><div class="job-meta"><span>下次运行 <b>${esc(nextText)}</b></span><span>规则 <b>当天 + 7 天</b></span><span><b>仅尝试该时段，不改订</b></span></div>${lastHtml}`;
    }
    function renderJob(job) {
      const container = document.querySelector('#active-job');
      if (!job) { container.innerHTML = '<div class="empty">当前没有待执行预约。</div>'; return; }
      const status = job.dispatch?.status || 'scheduled';
      container.innerHTML = `<div class="job-summary"><div><div class="job-date">${esc(jobDateLabel(job.date))}</div><div class="job-time"><time>${esc(job.start)}–${esc(job.end)}</time></div></div><div class="job-status">${badge(status)}</div></div><div class="job-meta"><span>开抢 <b>${dateTime(job.openAt)}</b></span><span>球场 <b>${esc(job.courtOrder.join(' → '))}</b></span><span>参与者 <b>${esc(job.participants.join(' · '))}</b></span><span><b>${esc(job.bookingType)}</b></span></div>`;
    }
    function bookingTable(bookings) {
      return `<div class="table-wrap"><table><thead><tr><th>时间</th><th>球场</th><th>参与者</th><th>支付</th><th>核验</th></tr></thead><tbody>${bookings.map(b => `<tr><td class="tight">${esc(jobDateLabel(b.date))}<br><span class="mono muted">${esc(b.start)}–${esc(b.end)}</span></td><td>${esc(b.court)}<br><span class="muted">${esc(b.bookingType)}</span></td><td>${esc(b.participants.join(' · '))}</td><td>${badge(b.paymentStatus)}</td><td><time>${dateTime(b.verifiedAt)}</time></td></tr>`).join('')}</tbody></table></div>`;
    }
    function renderBookings(groups, remoteSync) {
      const syncState = remoteSync?.state || 'unavailable';
      const syncLabel = syncState === 'fresh' ? '已同步' : syncState === 'stale' ? '缓存' : '不可用';
      const syncNote = remoteSync?.syncedAt ? `${syncLabel} ${dateTime(remoteSync.syncedAt)}` : '远端同步不可用';
      const upcoming = groups?.upcoming || [];
      const past = groups?.past || [];
      document.querySelector('#upcoming-count').textContent = `${upcoming.length} 条 · ${syncNote}`;
      document.querySelector('#past-count').textContent = `${past.length} 条 · ${syncNote}`;
      const upcomingEl = document.querySelector('#upcoming-bookings');
      const pastEl = document.querySelector('#past-bookings');
      if (syncState === 'unavailable') {
        const message = '<div class="empty">无法读取 Hello Club，本地记录不会显示为当前预约。</div>';
        upcomingEl.innerHTML = message; pastEl.innerHTML = message; return;
      }
      upcomingEl.innerHTML = upcoming.length ? bookingTable(upcoming) : '<div class="empty">Hello Club 暂未返回即将到来的预约。</div>';
      pastEl.innerHTML = past.length ? bookingTable(past) : '<div class="empty">Hello Club 暂未返回历史预约。</div>';
    }
    const SOURCE_LABELS = { dispatcher: '调度器', runner: '运行器' };
    function activityDescription(event) {
      if (event.kind === 'dispatcher') return event.reason ? esc(event.reason) : event.exitCode == null ? '调度器状态更新。' : `退出码 ${esc(event.exitCode)}。`;
      if (event.selection?.court) return `候选球场：${esc(event.selection.court)} · 已检查 ${esc(event.selection.checked?.join(', ') || '—')}`;
      if (event.selection?.status) return esc(statusLabel(event.selection.status));
      if (event.errorCode) return `失败：${esc(event.errorCode)}`;
      return event.attempts ? `扫描 ${esc(event.attempts)} 次。` : '运行器状态更新。';
    }
    function renderActivity(events) {
      const el = document.querySelector('#activity');
      if (!events.length) { el.innerHTML = '<div class="empty">暂无调度事件。</div>'; return; }
      el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>时间</th><th>来源</th><th>任务</th><th>状态</th><th>详情</th></tr></thead><tbody>${events.map(e => `<tr><td class="tight"><time>${dateTime(e.timestamp)}</time></td><td>${esc(SOURCE_LABELS[e.kind] || e.kind)}</td><td class="mono">${esc(e.jobId || '—')}</td><td>${badge(e.status)}</td><td class="muted">${activityDescription(e)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    async function refresh() {
      const error = document.querySelector('#error');
      try {
        const response = await fetch('/api/status', { cache:'no-store' });
        if (!response.ok) throw new Error('Status endpoint returned an error');
        const status = await response.json();
        renderProcesses(status.processes); renderSuccess(status.lastSuccess); renderFailure(status.lastFailure); renderJob(status.activeJob); renderRecurring(status.recurring); renderBookings(status.bookings, status.remoteSync); renderActivity(status.activity);
        document.querySelector('#safety').textContent = status.safety.message;
        document.querySelector('#updated').textContent = `更新于 ${dateTime(status.generatedAt)}`;
        error.classList.remove('show');
      } catch (err) { error.textContent = '实时状态暂时不可用，页面会自动重试。'; error.classList.add('show'); }
    }
    if (location.protocol === 'file:') {
      const error = document.querySelector('#error');
      error.textContent = '此面板需要本地状态服务，请通过 http://127.0.0.1:8787 打开，不要直接打开 control-panel.html。';
      error.classList.add('show');
      document.querySelector('#updated').textContent = '请通过本地服务打开';
    } else {
      refresh(); setInterval(refresh, 3_600_000);
    }
  </script>
</body>
</html>
